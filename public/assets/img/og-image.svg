<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle matrix dots -->
  <g opacity="0.08" fill="#00ff41" font-family="Courier New" font-size="16">
    <text x="50"  y="80">01001010</text>
    <text x="200" y="120">10110101</text>
    <text x="900" y="60">01101010</text>
    <text x="1050" y="100">10010110</text>
    <text x="50"  y="560">01110010</text>
    <text x="950" y="580">10101011</text>
  </g>
  <!-- Name -->
  <text x="600" y="240" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">Jasmine Walker</text>
  <!-- Tagline -->
  <text x="600" y="310" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="28" font-weight="300" fill="rgba(255,255,255,0.65)">Application developer &amp; systems engineer</text>
  <!-- Divider -->
  <rect x="450" y="355" width="300" height="1" fill="rgba(255,255,255,0.2)"/>
  <!-- Choose your view -->
  <text x="600" y="400" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="20" fill="rgba(255,255,255,0.4)" letter-spacing="0.1em">CHOOSE YOUR VIEW</text>
  <!-- Three themes -->
  <g font-family="Inter,-apple-system,sans-serif" font-size="18">
    <!-- Plain -->
    <rect x="270" y="435" width="160" height="48" rx="8" fill="white" opacity="0.9"/>
    <text x="350" y="465" text-anchor="middle" fill="#1a3a5c" font-weight="600">Plain</text>
    <!-- Matrix -->
    <rect x="460" y="435" width="160" height="48" rx="8" fill="#001a00" stroke="#00ff41" stroke-width="1" opacity="0.9"/>
    <text x="540" y="465" text-anchor="middle" fill="#00ff41" font-family="Courier New,monospace" font-weight="600">Matrix</text>
    <!-- XP -->
    <rect x="650" y="435" width="160" height="48" rx="8" fill="#ece9d8" opacity="0.9"/>
    <text x="730" y="465" text-anchor="middle" fill="#1a1a1a" font-family="Tahoma,sans-serif" font-weight="600">Windows XP</text>
  </g>
  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="16" fill="rgba(255,255,255,0.3)">jasminejwalker.com</text>
</svg>
